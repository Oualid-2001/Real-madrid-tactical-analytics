[theme]
base = "light"
primaryColor = "#2f64d8"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#10213a"
codeBackgroundColor = "#eef3f9"
borderColor = "#dfe6f0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
paddingTop = "1.5rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#2f64d8", "#62b6da", "#b6d84a", "#d7b96d"]
dataframeBorderColor = "#dfe6f0"
dataframeHeaderBackgroundColor = "#eef3f9"
dataframeHeaderTextColor = "#10213a"

[theme.sidebar]
backgroundColor = "#fafbfd"
secondaryBackgroundColor = "#ffffff"
borderColor = "#dfe6f0"
paddingTop = "1.5rem"
paddingBottom = "1.5rem"
